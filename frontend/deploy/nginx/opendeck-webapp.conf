# opendeck.ca — missing backend routing, fixed
#
# WHERE THIS GOES: paste the blocks below inside the existing `server { }`
# block that serves opendeck.ca (the one already pointing `root` at this
# project's `dist/` and doing the SPA `try_files` fallback). Find it with:
#
#   sudo nginx -T 2>/dev/null | grep -n "server_name\|location"
#
# Then:
#   sudo nginx -t                 # validate syntax before touching the live config
#   sudo systemctl reload nginx
#
# Background / verification: see ../../docs/NGINX_WEBAPP_ROUTING.md and
# run ../../scripts/verify-webapp-routing.sh against production afterwards.
#
# ---------------------------------------------------------------------------
# 1) Main backend API + real-money table WebSocket + Cash Game Demo SSE.
#    Currently there is NO location block for /webapp/ at all, so every
#    request under it (login, register, wallet, tournaments, the real cash
#    table, and all three static demo games' join/deal/action calls) falls
#    through to the SPA's index.html. This is the single root cause of
#    "every link shows a red error" - see docs/NGINX_WEBAPP_ROUTING.md.
# ---------------------------------------------------------------------------
location /webapp/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;

    # Real-money table WebSocket (wss://opendeck.ca/webapp/ws/table/...)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # So req.ip on the backend reflects the real client, not nginx's own
    # address (server.js has `app.set('trust proxy', 1)`; without this
    # header every account's signup_ip/last_login_ip would show nginx's IP).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;

    # So SSE (GET /webapp/cashgame-demo/stream, /webapp/heads-up/stream,
    # /webapp/RNG-shuffle-tester/stream, /webapp/cashgame/:id/stream)
    # actually streams instead of nginx buffering until the connection
    # closes. Safe to leave on globally here - nothing else under /webapp/
    # needs response buffering.
    proxy_buffering off;
}

# ---------------------------------------------------------------------------
# 2) SideBet prediction-market API - a SEPARATE Node process from the main
#    backend (see .env.example: VITE_SIDEBET_API_BASE_URL defaults to
#    http://localhost:4000 in local dev, vs. the main backend's 8000).
#    Same missing-proxy problem as /webapp/ above, just not yet documented
#    or reported because /sidebet isn't linked from the homepage. CONFIRM
#    the actual production port for the sidebet-server process before
#    applying - 4000 is the local-dev default, not a verified prod value.
# ---------------------------------------------------------------------------
location /sidebet-api/ {
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
}

# ---------------------------------------------------------------------------
# 3) No-trailing-slash redirects for the static demo pages. Vite copies
#    public/* verbatim into dist/*, so e.g. /cashgame-demo/index.html
#    exists as a real directory+file, but a bare /cashgame-demo (no slash)
#    doesn't match the SPA's `try_files $uri $uri/ /index.html;` rule at
#    the $uri step and falls through to the React app's index.html instead
#    of the demo. /cashgame-demo/ (with the slash) already works via the
#    $uri/ step, same as /sidebet-sim already does - these three are the
#    ones missing it. Put these ABOVE the SPA's catch-all `location / { }`.
# ---------------------------------------------------------------------------
location = /cashgame-demo      { return 301 /cashgame-demo/; }
location = /heads-up           { return 301 /heads-up/; }
location = /RNG-shuffle-tester { return 301 /RNG-shuffle-tester/; }
